<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradient (Neon Emerald to Cyan) -->
    <linearGradient id="neonGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glowing Orange Gradient -->
    <linearGradient id="warmGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Device / Screen Silhouette Frame -->
  <rect x="30" y="24" width="60" height="72" rx="10" stroke="url(#neonGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>
  
  <!-- Screen Speaker / Dynamic Island Pill -->
  <rect x="52" y="30" width="16" height="3" rx="1.5" fill="url(#neonGrad)" opacity="0.7"/>

  <!-- Inner Reverse-Engineering Loop & Code Nodes -->
  <!-- Left Reverse Arrow Arc -->
  <path d="M 44 48 C 40 56, 40 64, 46 72" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polyline points="40,51 44,48 48,51" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right Forward Arrow Arc -->
  <path d="M 76 72 C 80 64, 80 56, 74 48" stroke="url(#warmGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polyline points="80,69 76,72 72,69" stroke="url(#warmGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Central Core Spark / Deconstruction Diamond -->
  <polygon points="60,52 68,60 60,68 52,60" fill="url(#neonGrad)" filter="url(#neonGlow)"/>
  <circle cx="60" cy="60" r="3" fill="#FFFFFF"/>
</svg>
